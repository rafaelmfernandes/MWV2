<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>MusicalWorld - Chat</title>

    <!-- =========================================================
         MUSICALWORLD — CHAT
         Arquivo: chat.html

         Responsabilidade:

         - Estrutura da página de uma conversa individual
         - Cabeçalho do participante
         - Área das mensagens
         - Campo de texto
         - Seleção de arquivos
         - Composição de anexos

         A lista de conversas continua em mensagens.html.
         ========================================================= -->

    <!-- =========================================================
         CSS
         ========================================================= -->

    <link
        rel="stylesheet"
        href="css/chat/chat.css"
    >

    <!-- =========================================================
         SUPABASE
         ========================================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- =========================================================
         ÍCONES
         ========================================================= -->

    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<div class="chat-page">

    <!-- =====================================================
         CABEÇALHO
         ===================================================== -->

    <header class="chat-header">

        <button
            type="button"
            class="chat-back-button"
            onclick="voltarMensagens()"
            aria-label="Voltar para mensagens"
            title="Voltar para mensagens"
        >
            <i data-lucide="arrow-left"></i>
        </button>

        <div class="chat-user-info">

            <div class="chat-user-avatar-wrapper">

                <img
                    id="chatUserAvatar"
                    class="chat-user-avatar"
                    src=""
                    alt="Foto do usuário"
                >

                <div
                    id="chatUserAvatarFallback"
                    class="chat-user-avatar-fallback"
                    aria-hidden="true"
                >
                    <span id="chatUserInitials">?</span>
                </div>

            </div>

            <div class="chat-user-details">

                <div class="chat-user-name-row">

                    <h1
                        id="chatUserName"
                        class="chat-user-name"
                    >
                        Carregando...
                    </h1>

                </div>

                <div
                    id="chatUserContext"
                    class="chat-user-context"
                >
                    Conversa
                </div>

            </div>

        </div>

        <button
            type="button"
            class="chat-options-button"
            onclick="abrirOpcoesChat()"
            aria-label="Opções da conversa"
            title="Opções da conversa"
        >
            <i data-lucide="more-vertical"></i>
        </button>

    </header>


    <!-- =====================================================
         ÁREA PRINCIPAL DAS MENSAGENS
         ===================================================== -->

    <main
        id="chatMessages"
        class="chat-messages"
        aria-live="polite"
        aria-label="Mensagens da conversa"
    >

        <div
            id="chatLoading"
            class="chat-state"
        >

            <div class="chat-loading-spinner"></div>

            <p>
                Carregando conversa...
            </p>

        </div>

    </main>


    <!-- =====================================================
         PRÉ-VISUALIZAÇÃO DO ANEXO
         ===================================================== -->

    <div
        id="chatAttachmentPreview"
        class="chat-attachment-preview"
        hidden
    >

        <div class="chat-attachment-preview-content">

            <div
                id="chatAttachmentPreviewIcon"
                class="chat-attachment-preview-icon"
            >
                <i data-lucide="file"></i>
            </div>

            <div class="chat-attachment-preview-info">

                <strong
                    id="chatAttachmentPreviewName"
                    class="chat-attachment-preview-name"
                >
                    Arquivo
                </strong>

                <span
                    id="chatAttachmentPreviewSize"
                    class="chat-attachment-preview-size"
                >
                    0 KB
                </span>

                <span
                    id="chatAttachmentPreviewStatus"
                    class="chat-attachment-preview-status"
                >
                    Pronto para enviar
                </span>

            </div>

            <button
                type="button"
                id="chatAttachmentRemove"
                class="chat-attachment-remove"
                onclick="removerAnexoSelecionado()"
                aria-label="Remover arquivo"
                title="Remover arquivo"
            >
                <i data-lucide="x"></i>
            </button>

        </div>

        <div
            id="chatAttachmentImagePreview"
            class="chat-attachment-image-preview"
            hidden
        >
            <img
                id="chatAttachmentImage"
                src=""
                alt="Pré-visualização do arquivo"
            >
        </div>

        <div
            id="chatAttachmentVideoPreview"
            class="chat-attachment-video-preview"
            hidden
        >
            <video
                id="chatAttachmentVideo"
                controls
                preload="metadata"
            ></video>
        </div>

    </div>


    <!-- =====================================================
         COMPOSITOR
         ===================================================== -->

    <footer class="chat-composer">

        <button
            type="button"
            class="chat-attachment-button"
            onclick="anexarArquivo()"
            aria-label="Adicionar arquivo"
            title="Adicionar arquivo"
        >
            <i data-lucide="plus"></i>
        </button>

        <div class="chat-input-wrapper">

            <textarea
                id="chatMessageInput"
                class="chat-message-input"
                rows="1"
                maxlength="5000"
                placeholder="Escreva uma mensagem..."
                autocomplete="off"
                aria-label="Mensagem"
            ></textarea>

        </div>

        <button
            type="button"
            id="chatSendButton"
            class="chat-send-button"
            onclick="enviarMensagem()"
            aria-label="Enviar mensagem"
            title="Enviar mensagem"
        >
            <i data-lucide="send"></i>
        </button>

    </footer>

</div>


<!-- =========================================================
     INPUT DE ARQUIVO
     ========================================================= -->

<input
    type="file"
    id="chatFileInput"
    hidden
    accept="
        image/jpeg,
        image/png,
        image/webp,
        video/mp4,
        video/webm,
        video/quicktime,
        application/pdf,
        application/msword,
        application/vnd.openxmlformats-officedocument.wordprocessingml.document,
        application/vnd.ms-excel,
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,
        application/vnd.ms-powerpoint,
        application/vnd.openxmlformats-officedocument.presentationml.presentation,
        text/plain
    "
>


<!-- =========================================================
     SCRIPTS
     ========================================================= -->

<script src="js/core/SupabaseClient.js"></script>

<script src="js/core/Sessao.js"></script>

<script src="js/chat/chat.js"></script>

</body>

</html>
