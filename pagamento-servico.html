<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtistaShow - Forma de Pagamento</title>
  <link rel="stylesheet" href="css/pagamento-servico.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Top Bar -->
    <div class="profile-top-actions">
      <button class="icon-circle-btn" onclick="window.history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </button>
      <span class="top-bar-title">Contratação</span>
      <div style="width: 36px;"></div>
    </div>

    <div class="checkout-container" style="margin-top: 15px;">
      
      <!-- Stepper / Progresso -->
      <div class="stepper-header">
        <div class="step-info">
          <span>Passo 2 de 2</span>
          <strong>Pagamento</strong>
        </div>
        <div class="stepper-bars">
          <div class="bar active"></div>
          <div class="bar active"></div>
        </div>
      </div>

      <!-- Resumo do Pedido -->
      <div class="checkout-card" style="background-color: #161619;">
        <span class="checkout-etapa">Resumo da Contratação</span>
        <h2 id="resumo-servico-nome" style="font-size: 15px; color: #fff; margin-top: 4px;">Serviço</h2>
        <span id="resumo-local-data" style="font-size: 12px; color: #a1a1aa; margin-top: 2px; display: block;">Local e Data...</span>
        <span id="resumo-servico-preco" style="font-size: 14px; color: #38bdf8; font-weight: 700; margin-top: 6px; display: block;">R$ 0,00</span>
      </div>

      <!-- Seleção de Métodos de Pagamento -->
      <div class="checkout-card">
        <span class="checkout-etapa">Escolha a Forma de Pagamento</span>
        
        <!-- Opção PIX -->
        <label class="payment-option">
          <input type="radio" name="forma_pagamento" value="pix" checked onclick="mudarMetodoPagamento('pix')">
          <div class="payment-info">
            <strong>PIX</strong>
            <span>Aprovação instantânea</span>
          </div>
        </label>

        <!-- Opção Cartão de Crédito ou Débito -->
        <label class="payment-option">
          <input type="radio" name="forma_pagamento" value="cartao" onclick="mudarMetodoPagamento('cartao')">
          <div class="payment-info">
            <strong>Cartão de Crédito ou Débito</strong>
            <span>Selecione ou cadastre um cartão</span>
          </div>
        </label>

        <!-- Seção Dinâmica de Cartões -->
        <div id="secao-cartoes" style="display: none; margin-top: 10px; flex-direction: column; gap: 8px;">
          <span style="font-size: 12px; color: #a1a1aa; margin-top: 4px;">Seus Cartões Salvos:</span>
          
          <div id="lista-cartoes-salvos" style="display: flex; flex-direction: column; gap: 8px;">
            <!-- Inserido via JavaScript -->
          </div>

          <button type="button" class="btn-novo-cartao" onclick="abrirModalNovoCartao()">+ Cadastrar Novo Cartão</button>
        </div>

        <button class="btn-continuar-proximo" onclick="finalizarContratacao()" style="margin-top: 20px;">Confirmar e Contratar</button>
      </div>

    </div>

  </div>

  <!-- Modal para Cadastrar Novo Cartão -->
  <div id="modal-cartao" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <h3 style="font-size: 16px; color: #fff; margin-bottom: 12px;">Cadastrar Novo Cartão</h3>
      
      <div class="form-group">
        <label>Número do Cartão</label>
        <input type="text" id="novo-num-cartao" placeholder="0000 0000 0000 0000" class="input-custom">
      </div>
      
      <div class="form-group" style="margin-top: 10px;">
        <label>Nome no Cartão</label>
        <input type="text" id="novo-nome-cartao" placeholder="Como está no cartão" class="input-custom">
      </div>

      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <div class="form-group" style="flex: 1;">
          <label>Validade</label>
          <input type="text" id="novo-val-cartao" placeholder="MM/AA" class="input-custom">
        </div>
        <div class="form-group" style="flex: 1;">
          <label>CVV</label>
          <input type="text" id="novo-cvv-cartao" placeholder="123" class="input-custom">
        </div>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 16px;">
        <button class="btn-continuar-proximo" style="background-color: #27272a; margin-top:0;" onclick="fecharModalNovoCartao()">Cancelar</button>
        <button class="btn-continuar-proximo" style="margin-top:0;" onclick="salvarNovoCartao()">Salvar Cartão</button>
      </div>
    </div>
  </div>

  <script src="js/pagamento-servico.js"></script>
</body>
</html>
