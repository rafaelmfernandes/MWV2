<!-- =====================================================
     INICIALIZAÇÃO DA PÁGINA

     Responsabilidades:
     - Carregar os dados.
     - Renderizar informações gerais.
     - Inicializar portfólio.
     - Inicializar serviços.
     - Inicializar ações.
     - Exibir erros de carregamento.
     ===================================================== -->

<script>

    document.addEventListener(
        "DOMContentLoaded",
        async function () {

            console.log(
                "MusicalWorld — Inicializando apresentação de perfil de teste..."
            );


            try {


                /* =================================================
                   1. VERIFICAR MÓDULO DE DADOS
                   ================================================= */

                if (
                    !window.ApresentarPerfilDadosTeste
                ) {

                    throw new Error(
                        "Módulo de dados não carregado."
                    );

                }


                /* =================================================
                   2. CARREGAR DADOS
                   ================================================= */

                await window
                    .ApresentarPerfilDadosTeste
                    .carregarTudo();


                console.log(
                    "MusicalWorld — Dados do perfil carregados."
                );


                /* =================================================
                   3. RENDERIZAR DADOS GERAIS
                   ================================================= */

                if (
                    window.ApresentarPerfilRenderTeste
                ) {

                    window
                        .ApresentarPerfilRenderTeste
                        .renderizar();

                }


                /* =================================================
                   4. INICIALIZAR PORTFÓLIO
                   ================================================= */

                if (
                    window.ApresentarPerfilPortfolioTeste
                ) {

                    await window
                        .ApresentarPerfilPortfolioTeste
                        .inicializar();

                }


                /* =================================================
                   5. INICIALIZAR SERVIÇOS

                   Os serviços já foram carregados pelo
                   ApresentarPerfilDados.js.

                   Portanto, este módulo NÃO precisa consultar
                   o Supabase novamente.
                   ================================================= */

                if (
                    window.ApresentarPerfilServicosTeste
                ) {

                    const dados =
                        window
                            .ApresentarPerfilDadosTeste
                            .obterDados();


                    const servicos =
                        dados &&
                        Array.isArray(
                            dados.servicos
                        )
                            ? dados.servicos
                            : [];


                    window
                        .ApresentarPerfilServicosTeste
                        .inicializar(
                            servicos
                        );

                }


                /* =================================================
                   6. INICIALIZAR AÇÕES
                   ================================================= */

                if (
                    window.ApresentarPerfilAcoesTeste
                ) {

                    window
                        .ApresentarPerfilAcoesTeste
                        .inicializar();

                }


                console.log(
                    "MusicalWorld — Apresentação de perfil carregada com sucesso."
                );


            } catch (erro) {


                /* =================================================
                   TRATAMENTO DE ERRO
                   ================================================= */

                console.error(
                    "MusicalWorld — Erro ao iniciar apresentação do perfil:",
                    erro
                );


                const erroContainer =
                    document.getElementById(
                        "profileError"
                    );


                const erroMensagem =
                    document.getElementById(
                        "profileErrorMessage"
                    );


                if (erroContainer) {

                    erroContainer.hidden =
                        false;

                }


                if (erroMensagem) {

                    erroMensagem.textContent =
                        erro &&
                        erro.message
                            ? erro.message
                            : "Ocorreu um erro ao carregar o perfil.";

                }

            }

        }
    );

</script>
