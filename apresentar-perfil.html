<!-- =====================================================
     INICIALIZAÇÃO
     ===================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        console.log(
            "MusicalWorld — Inicializando apresentação de perfil de teste..."
        );

        try {

            /* =================================================
               1. VERIFICAR MÓDULO DE DADOS
               ================================================= */

            if (
                !window.ApresentarPerfilDadosTeste
            ) {

                throw new Error(
                    "Módulo de dados não carregado."
                );

            }

            /* =================================================
               2. CARREGAR DADOS DO PERFIL
               ================================================= */

            await window
                .ApresentarPerfilDadosTeste
                .carregarTudo();

            console.log(
                "MusicalWorld — Dados do perfil carregados."
            );

            /* =================================================
               3. RENDERIZAR DADOS GERAIS

               A identidade é renderizada aqui.

               O conteúdo do portfólio é renderizado
               separadamente pelo módulo de portfólio.
               ================================================= */

            if (
                window.ApresentarPerfilRenderTeste
            ) {

                window
                    .ApresentarPerfilRenderTeste
                    .renderizar();

            }

            /* =================================================
               4. INICIALIZAR PORTFÓLIO
               ================================================= */

            if (
                window.ApresentarPerfilPortfolioTeste
            ) {

                await window
                    .ApresentarPerfilPortfolioTeste
                    .inicializar();

            }

            /* =================================================
               5. INICIALIZAR SERVIÇOS
               ================================================= */

            if (
                window.ApresentarPerfilServicosTeste
            ) {

                const dados =
                    window
                        .ApresentarPerfilDadosTeste
                        .obterDados();

                const servicos =
                    dados &&
                    Array.isArray(
                        dados.servicos
                    )
                        ? dados.servicos
                        : [];

                window
                    .ApresentarPerfilServicosTeste
                    .inicializar(
                        servicos
                    );

            }

            /* =================================================
               6. INICIALIZAR AVALIAÇÕES

               As avaliações continuam em sua própria
               seção abaixo dos serviços.

               Elas NÃO aparecem na área do portfólio.
               ================================================= */

            if (
                window.ApresentarPerfilAvaliacoesTeste
            ) {

                const dados =
                    window
                        .ApresentarPerfilDadosTeste
                        .obterDados();

                const avaliacoes =
                    dados &&
                    Array.isArray(
                        dados.avaliacoes
                    )
                        ? dados.avaliacoes
                        : [];

                const secaoAvaliacoes =
                    document.getElementById(
                        "profileReviews"
                    );

                const containerAvaliacoes =
                    document.getElementById(
                        "reviewsRender"
                    );

                if (
                    avaliacoes.length > 0 &&
                    containerAvaliacoes
                ) {

                    window
                        .ApresentarPerfilAvaliacoesTeste
                        .renderizar({
                            container:
                                containerAvaliacoes
                        });

                    if (
                        secaoAvaliacoes
                    ) {

                        secaoAvaliacoes.hidden =
                            false;

                    }

                    console.log(
                        "MusicalWorld — Avaliações públicas renderizadas:",
                        avaliacoes.length
                    );

                } else {

                    if (
                        secaoAvaliacoes
                    ) {

                        secaoAvaliacoes.hidden =
                            true;

                    }

                    console.log(
                        "MusicalWorld — Este perfil ainda não possui avaliações públicas."
                    );

                }

            } else {

                console.warn(
                    "MusicalWorld — Módulo de avaliações públicas não carregado."
                );

            }

            /* =================================================
               7. INICIALIZAR AÇÕES
               ================================================= */

            if (
                window.ApresentarPerfilAcoesTeste
            ) {

                window
                    .ApresentarPerfilAcoesTeste
                    .inicializar();

            }

            /* =================================================
               8. FINALIZAÇÃO
               ================================================= */

            console.log(
                "MusicalWorld — Apresentação de perfil carregada com sucesso."
            );

        } catch (erro) {

            /* =================================================
               TRATAMENTO DE ERRO
               ================================================= */

            console.error(
                "MusicalWorld — Erro ao iniciar apresentação do perfil:",
                erro
            );

            const erroContainer =
                document.getElementById(
                    "profileError"
                );

            const erroMensagem =
                document.getElementById(
                    "profileErrorMessage"
                );

            if (erroContainer) {

                erroContainer.hidden =
                    false;

            }

            if (erroMensagem) {

                erroMensagem.textContent =
                    erro &&
                    erro.message
                        ? erro.message
                        : "Ocorreu um erro ao carregar o perfil.";

            }

        }

    }

);

</script>
