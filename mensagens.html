<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MusicalWorld - Mensagens</title>

<link rel="stylesheet" href="css/mensagens.css">
</head> <body>
<div class="app-container">

    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <header class="navbar">

        <div class="navbar-left">

            <button
                class="back-btn"
                type="button"
                onclick="voltarPagina()"
                aria-label="Voltar"
                title="Voltar"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>

            <div class="page-title-wrapper">
                <h1 class="page-title">Mensagens</h1>
                <span class="page-subtitle">Suas conversas</span>
            </div>

        </div>

        <button
            class="nav-icon-btn"
            type="button"
            onclick="novaMensagem()"
            aria-label="Nova mensagem"
            title="Nova mensagem"
        >
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 8.7 3.9a8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
        </button>

    </header>


    <!-- =====================================================
         CONTEÚDO PRINCIPAL
    ====================================================== -->

    <main class="main-content">

        <!-- Busca -->

        <div class="search-box">

            <svg
                class="search-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>

            <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="Buscar nas conversas..."
                autocomplete="off"
            >

            <button
                id="clearSearch"
                class="clear-search"
                type="button"
                onclick="limparBusca()"
                aria-label="Limpar busca"
                title="Limpar busca"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

        </div>


        <!-- Filtros -->

        <div class="categories-tabs">

            <button
                class="cat-tab ativo"
                type="button"
                data-filtro="todas"
                onclick="filtrarConversas('todas', this)"
            >
                Todas
            </button>

            <button
                class="cat-tab"
                type="button"
                data-filtro="contratados"
                onclick="filtrarConversas('contratados', this)"
            >
                Contratados
            </button>

            <button
                class="cat-tab"
                type="button"
                data-filtro="servicos"
                onclick="filtrarConversas('servicos', this)"
            >
                Serviços feitos
            </button>

        </div>


        <!-- Lista de conversas -->

        <section
            id="conversationsList"
            class="conversations-list"
        ></section>

    </main>


    <!-- =====================================================
         MODAL / CHAT
    ====================================================== -->

    <section
        id="chat-modal"
        class="chat-modal-container"
        aria-hidden="true"
    >

        <!-- Cabeçalho do chat -->

        <header class="chat-header">

            <button
                class="back-btn chat-back-btn"
                type="button"
                onclick="fecharChat()"
                aria-label="Fechar conversa"
                title="Voltar"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>


            <div class="chat-user-profile">

                <div
                    class="chat-avatar-mini"
                    id="chat-active-avatar"
                >
                    RM
                </div>

                <div class="chat-user-info">

                    <div class="chat-name-row">

                        <h2 id="chat-active-name">
                            Rafael Melo
                        </h2>

                        <span
                            id="chat-online-status"
                            class="online-status"
                        >
                            Online
                        </span>

                    </div>

                    <span
                        id="chat-active-context"
                        class="chat-context-sub"
                    >
                        Voz e violão
                    </span>

                </div>

            </div>


            <button
                class="chat-more-btn"
                type="button"
                onclick="abrirOpcoesChat()"
                aria-label="Mais opções"
                title="Mais opções"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <circle cx="12" cy="5" r="1"></circle>
                    <circle cx="12" cy="12" r="1"></circle>
                    <circle cx="12" cy="19" r="1"></circle>
                </svg>
            </button>

        </header>


        <!-- Mensagens -->

        <div
            class="chat-messages-body"
            id="chat-body"
        ></div>


        <!-- Campo de envio -->

        <footer class="chat-input-footer">

            <button
                class="attachment-btn"
                type="button"
                onclick="anexarArquivo()"
                aria-label="Adicionar anexo"
                title="Adicionar anexo"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                </svg>
            </button>


            <input
                type="text"
                id="msg-input"
                placeholder="Escreva uma mensagem..."
                autocomplete="off"
            >


            <button
                class="send-btn"
                type="button"
                onclick="enviarMensagem()"
                aria-label="Enviar mensagem"
                title="Enviar mensagem"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>

        </footer>

    </section>


    <!-- =====================================================
         NAVEGAÇÃO INFERIOR
    ====================================================== -->

    <nav class="bottom-nav">

        <button
            class="bottom-nav-item"
            type="button"
            onclick="irParaInicio()"
        >

            <svg
                class="nav-icon-svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>

            <span class="nav-label">Início</span>

        </button>


        <button
            class="bottom-nav-item"
            type="button"
            onclick="irParaAnunciar()"
        >

            <svg
                class="nav-icon-svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="16"></line>
                <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>

            <span class="nav-label">Anunciar</span>

        </button>


        <button
            class="bottom-nav-item ativo"
            type="button"
            onclick="irParaMensagens()"
        >

            <svg
                class="nav-icon-svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 8.7 3.9a8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>

            <span class="nav-label">Mensagens</span>

        </button>


        <button
            class="bottom-nav-item"
            type="button"
            onclick="irParaPerfil()"
        >

            <svg
                class="nav-icon-svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>

            <span class="nav-label">Perfil</span>

        </button>

    </nav>

</div>


<script src="js/mensagens.js"></script>
</body>
</html>
