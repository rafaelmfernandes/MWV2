<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <!-- =====================================================
         CONFIGURAÇÕES BÁSICAS
    ====================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>MusicalWorld - Mensagens</title>


    <!-- =====================================================
         CSS DA PÁGINA
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/mensagens.css"
    >


    <!-- =====================================================
         CSS DO MENU INFERIOR
         
         O menu é criado dinamicamente pelo:
         js/components/menu-inferior.js
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/menu-inferior.css"
    >

</head>


<body>


<div class="app-container">


    <!-- =====================================================
         CABEÇALHO
         
         Responsabilidade:
         - Voltar para a página anterior.
         - Exibir o título da página.
         - Exibir o botão para iniciar uma nova mensagem.
    ====================================================== -->

    <header class="navbar">

        <div class="navbar-left">


            <!-- =============================================
                 BOTÃO VOLTAR
            ============================================== -->

            <button
                class="back-btn"
                type="button"
                onclick="voltarPagina()"
                aria-label="Voltar"
                title="Voltar"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >

                    <line
                        x1="19"
                        y1="12"
                        x2="5"
                        y2="12"
                    ></line>

                    <polyline
                        points="12 19 5 12 12 5"
                    ></polyline>

                </svg>

            </button>


            <!-- =============================================
                 TÍTULO
            ============================================== -->

            <div class="page-title-wrapper">

                <h1 class="page-title">
                    Mensagens
                </h1>

                <span class="page-subtitle">
                    Suas conversas
                </span>

            </div>

        </div>


        <!-- =============================================
             NOVA MENSAGEM
        ============================================== -->

        <button
            class="nav-icon-btn"
            type="button"
            onclick="novaMensagem()"
            aria-label="Nova mensagem"
            title="Nova mensagem"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >

                <path
                    d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 8.7 3.9a8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
                ></path>

            </svg>

        </button>

    </header>


    <!-- =====================================================
         CONTEÚDO PRINCIPAL
    ====================================================== -->

    <main class="main-content">


        <!-- =================================================
             BUSCA
        ================================================== -->

        <div class="search-box">

            <svg
                class="search-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >

                <circle
                    cx="11"
                    cy="11"
                    r="8"
                ></circle>

                <line
                    x1="21"
                    y1="21"
                    x2="16.65"
                    y2="16.65"
                ></line>

            </svg>


            <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="Buscar nas conversas..."
                autocomplete="off"
                aria-label="Buscar nas conversas"
            >


            <button
                id="clearSearch"
                class="clear-search"
                type="button"
                onclick="limparBusca()"
                aria-label="Limpar busca"
                title="Limpar busca"
                hidden
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >

                    <line
                        x1="18"
                        y1="6"
                        x2="6"
                        y2="18"
                    ></line>

                    <line
                        x1="6"
                        y1="6"
                        x2="18"
                        y2="18"
                    ></line>

                </svg>

            </button>

        </div>


        <!-- =================================================
             FILTROS
        ================================================== -->

        <div
            class="categories-tabs"
            role="tablist"
            aria-label="Filtros de mensagens"
        >


            <!-- =============================================
                 TODAS
            ============================================== -->

            <button
                class="cat-tab ativo"
                type="button"
                data-filtro="todas"
                onclick="filtrarConversas('todas', this)"
                role="tab"
                aria-selected="true"
            >
                Todas
            </button>


            <!-- =============================================
                 CONTRATADOS
            ============================================== -->

            <button
                class="cat-tab"
                type="button"
                data-filtro="contratados"
                onclick="filtrarConversas('contratados', this)"
                role="tab"
                aria-selected="false"
            >
                Contratados
            </button>


            <!-- =============================================
                 SERVIÇOS
            ============================================== -->

            <button
                class="cat-tab"
                type="button"
                data-filtro="servicos"
                onclick="filtrarConversas('servicos', this)"
                role="tab"
                aria-selected="false"
            >
                Serviços feitos
            </button>

        </div>


        <!-- =================================================
             LISTA DE CONVERSAS
             
             O mensagens.js preenche esta área
             dinamicamente com os dados do Supabase.
        ================================================== -->

        <section
            id="conversationsList"
            class="conversations-list"
            aria-label="Lista de conversas"
        ></section>

    </main>


    <!-- =====================================================
         MENU INFERIOR
         
         IMPORTANTE:
         
         O menu NÃO é criado manualmente nesta página.
         
         O mesmo componente utilizado pelo index.html
         será carregado pelo:
         
         js/components/menu-inferior.js
         
         e renderizado dentro deste container.
    ====================================================== -->

    <div
        id="menu-inferior-container"
    ></div>


</div>


<!-- =====================================================
     SUPABASE
====================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"
></script>


<!-- =====================================================
     CORE
====================================================== -->

<script src="js/core/SupabaseClient.js"></script>

<script src="js/core/Sessao.js"></script>

<script src="js/core/UsuarioAtual.js"></script>

<script src="js/core/ControleSessao.js"></script>

<script src="js/core/RoteamentoPerfil.js"></script>


<!-- =====================================================
     LÓGICA DA PÁGINA DE MENSAGENS
====================================================== -->

<script src="js/mensagens.js"></script>


<!-- =====================================================
     MENU INFERIOR
     
     Utiliza exatamente o mesmo componente
     utilizado pelo index.html.
====================================================== -->

<script src="js/components/menu-inferior.js"></script>


</body>

</html>
