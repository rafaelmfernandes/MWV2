<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Notificações | MusicalWorld</title>


    <!-- =========================================================
         MUSICALWORLD — PÁGINA DE NOTIFICAÇÕES

         Arquivo:
         notificacoes.html

         Responsabilidade:
         - Estruturar a página de notificações.
         - Disponibilizar o cabeçalho.
         - Disponibilizar os estados da interface.
         - Carregar os estilos e módulos necessários.
         ========================================================= -->


    <!-- =========================================================
         CSS DA PÁGINA
         ========================================================= -->

    <link
        rel="stylesheet"
        href="css/notificacoes.css"
    >


    <!-- =========================================================
         LUCIDE
         ========================================================= -->

    <script
        src="https://unpkg.com/lucide@latest"
        defer
    ></script>

</head>


<body>


    <!-- =========================================================
         CABEÇALHO
         ========================================================= -->

    <header class="notificacoes-header">

        <div class="notificacoes-header-inner">


            <!-- =================================================
                 VOLTAR
                 ================================================= -->

            <button
                type="button"
                class="btn-voltar"
                id="btnVoltar"
                aria-label="Voltar"
                title="Voltar"
            >

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                    focusable="false"
                >

                    <path d="M19 12H5"></path>

                    <path d="M12 19l-7-7 7-7"></path>

                </svg>

            </button>


            <!-- =================================================
                 TÍTULO
                 ================================================= -->

            <div class="notificacoes-header-titulo">

                <h1>
                    Notificações
                </h1>

                <span
                    id="contadorNotificacoes"
                    class="contador-notificacoes"
                    aria-label="Quantidade de notificações não lidas"
                >
                    0
                </span>

            </div>


            <!-- =================================================
                 AÇÕES
                 ================================================= -->

            <div class="notificacoes-header-acoes">

                <button
                    type="button"
                    class="btn-marcar-todas"
                    id="btnMarcarTodas"
                >
                    Marcar todas como lidas
                </button>

            </div>

        </div>

    </header>


    <!-- =========================================================
         CONTEÚDO PRINCIPAL
         ========================================================= -->

    <main class="notificacoes-main">

        <section
            class="notificacoes-container"
            aria-label="Histórico de notificações"
        >


            <!-- =================================================
                 CARREGANDO
                 ================================================= -->

            <div
                id="estadoCarregando"
                class="estado-notificacoes estado-carregando"
            >

                <div
                    class="spinner-notificacoes"
                    aria-hidden="true"
                ></div>

                <p>
                    Carregando notificações...
                </p>

            </div>


            <!-- =================================================
                 LISTA
                 ================================================= -->

            <div
                id="listaNotificacoes"
                class="lista-notificacoes"
                aria-live="polite"
            ></div>


            <!-- =================================================
                 VAZIO
                 ================================================= -->

            <div
                id="estadoVazio"
                class="estado-notificacoes estado-vazio"
                hidden
            >

                <div
                    class="estado-vazio-icone"
                    aria-hidden="true"
                >

                    <svg
                        viewBox="0 0 24 24"
                        focusable="false"
                    >

                        <path
                            d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
                        ></path>

                        <path
                            d="M13.73 21a2 2 0 0 1-3.46 0"
                        ></path>

                    </svg>

                </div>

                <h2>
                    Nenhuma notificação
                </h2>

                <p>
                    Quando houver alguma novidade, ela aparecerá aqui.
                </p>

            </div>


            <!-- =================================================
                 ERRO
                 ================================================= -->

            <div
                id="estadoErro"
                class="estado-notificacoes estado-erro"
                hidden
            >

                <div
                    class="estado-erro-icone"
                    aria-hidden="true"
                >

                    <svg
                        viewBox="0 0 24 24"
                        focusable="false"
                    >

                        <circle
                            cx="12"
                            cy="12"
                            r="10"
                        ></circle>

                        <line
                            x1="12"
                            y1="8"
                            x2="12"
                            y2="12"
                        ></line>

                        <line
                            x1="12"
                            y1="16"
                            x2="12.01"
                            y2="16"
                        ></line>

                    </svg>

                </div>

                <h2>
                    Não foi possível carregar
                </h2>

                <p id="mensagemErro">
                    Ocorreu um problema ao carregar suas notificações.
                </p>

                <button
                    type="button"
                    id="btnTentarNovamente"
                    class="btn-tentar-novamente"
                >
                    Tentar novamente
                </button>

            </div>

        </section>

    </main>


    <!-- =========================================================
         SUPABASE
         ========================================================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"
    ></script>


    <!-- =========================================================
         NÚCLEO MUSICALWORLD
         ========================================================= -->

    <script src="js/core/SupabaseClient.js"></script>

    <script src="js/core/Sessao.js"></script>

    <script src="js/core/UsuarioAtual.js"></script>

    <script src="js/core/ControleSessao.js"></script>


    <!-- =========================================================
         MÓDULO DE NOTIFICAÇÕES
         ========================================================= -->

    <script src="js/notificacoes.js"></script>


    <!-- =========================================================
         LUCIDE
         ========================================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                if (
                    window.lucide &&
                    typeof window.lucide.createIcons === "function"
                ) {

                    window.lucide.createIcons();

                }

            }
        );

    </script>


</body>

</html>
