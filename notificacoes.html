<!DOCTYPE html> 
<html lang="pt-BR"> 
  <head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <meta name="theme-color" content="#ffffff"> 
    <title>MusicalWorld - Solicitações</title> 
    <link rel="stylesheet" href="css/notificacoes.css"> 
  </head> 
  
<body> 

<div class="app-container">
<!-- =====================================================
     CABEÇALHO
     ===================================================== -->

<header class="navbar">

  <div class="logo">
    Musical<span>World</span>
  </div>

  <button
    class="nav-icon-btn"
    onclick="voltarInicio()"
    aria-label="Voltar ao início"
    title="Voltar ao início"
  >

    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>

  </button>

</header>


<!-- =====================================================
     CONTEÚDO
     ===================================================== -->

<main class="main-content">

  <div class="page-header">

    <span class="page-kicker">
      CENTRAL DE SOLICITAÇÕES
    </span>

    <h1>
      Solicitações
    </h1>

    <p>
      Acompanhe propostas e contratações recebidas.
    </p>

  </div>


  <!-- FILTROS -->

  <div class="filter-tabs">

    <button
      class="filter-tab ativo"
      data-filtro="todas"
      onclick="filtrarSolicitacoes('todas')"
    >
      Todas
    </button>

    <button
      class="filter-tab"
      data-filtro="pendente"
      onclick="filtrarSolicitacoes('pendente')"
    >
      Pendentes
    </button>

    <button
      class="filter-tab"
      data-filtro="aceito"
      onclick="filtrarSolicitacoes('aceito')"
    >
      Aceitas
    </button>

  </div>


  <!-- LISTA -->

  <div
    id="notifications-list"
    class="notifications-list"
  ></div>


  <!-- ESTADO VAZIO -->

  <div
    id="empty-state"
    class="empty-state"
    style="display: none;"
  >

    <div class="empty-icon">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>

    </div>

    <h3>
      Nenhuma solicitação encontrada
    </h3>

    <p>
      Quando houver novas propostas, elas aparecerão aqui.
    </p>

  </div>

</main>


<!-- =====================================================
     MENU INFERIOR
     ===================================================== -->

<nav class="bottom-nav">

  <button
    class="bottom-nav-item"
    onclick="window.location.href='index.html'"
  >

    <svg
      class="nav-icon-svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>

    <span class="nav-label">
      Início
    </span>

  </button>


  <button
    class="bottom-nav-item"
    onclick="window.location.href='index.html'"
  >

    <svg
      class="nav-icon-svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="16"></line>
      <line x1="8" y1="12" x2="16" y2="12"></line>
    </svg>

    <span class="nav-label">
      Anunciar
    </span>

  </button>


  <button
    class="bottom-nav-item ativo"
    onclick="window.location.href='notificacoes.html'"
  >

    <svg
      class="nav-icon-svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
    </svg>

    <span class="nav-label">
      Alertas
    </span>

  </button>

</nav>
</div> <script src="js/notificacoes.js"></script> </body> </html>
