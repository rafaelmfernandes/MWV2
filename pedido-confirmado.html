<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sucesso - Agendamento Enviado</title>
    <link rel="stylesheet" href="css/pedido-confirmado.css">
</head>
<body>

    <div class="app-container sucesso-container">
        <!-- Conteúdo Principal de Sucesso -->
        <main class="conteudo-sucesso">
            <div class="cabecalho-sucesso">
                <h1>PARABÉNS!!!</h1>
                <p class="subtitulo-sucesso">Agendamento enviado com sucesso</p>
            </div>

            <!-- Card Central com Avatar sobreposto -->
            <div class="card-sucesso-wrapper">
                <div class="avatar-topo"></div>
                <div class="card-sucesso">
                    <div class="foto-bateria"></div>
                    <div class="valor-badge">
                        <span>Valor de R$ 800,00</span>
                    </div>
                </div>
            </div>

            <p class="aviso-resposta">
                Notificaremos você assim que o anunciante responder sua solicitação
            </p>
        </main>

        <!-- Rodapé com os dois botões -->
        <footer class="footer-dois-botoes">
            <button class="btn-secundario">Ir para solicitação</button>
            <button class="btn-avancar">Pagina inicial</button>
        </footer>
    </div>

</body>
</html>
