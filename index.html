<!-- =====================================================
     FILTRO — EVENTO DE FILTROS APLICADOS

     O modal-filtro.js dispara:

     musicalworld:filtros-aplicados

     Este listener entrega os filtros ao
     MusicalWorldFeed sem alterar o main.js.
     ===================================================== -->

<script>

window.addEventListener(
    'musicalworld:filtros-aplicados',
    function (event) {

        const filtros =
            event?.detail?.filtros || {};


        console.log(
            'Evento de filtros recebido pelo Index:',
            filtros
        );


        if (
            window.MusicalWorldFeed &&
            typeof window.MusicalWorldFeed.definirFiltros === 'function'
        ) {

            window.MusicalWorldFeed.definirFiltros(
                filtros
            );

            return;

        }


        console.warn(
            'MusicalWorldFeed ainda não está disponível para receber os filtros.'
        );

    }
);

</script>

<!-- =====================================================
     INICIALIZAÇÃO DOS COMPONENTES
     ===================================================== -->

<script>

document.addEventListener(
    'DOMContentLoaded',
    async function () {

        console.log(
            'Inicializando componentes principais do MusicalWorld...'
        );


        /*
        -------------------------------------------------
        CABEÇALHO
        -------------------------------------------------

        O Cabecalho continua responsável pela sessão,
        mensagens não lidas, Realtime e prévias de novas
        mensagens.

        Também controla o menu da conta aberto através
        da seta ao lado da logo.

        -------------------------------------------------
        */

        if (
            window.Cabecalho &&
            typeof window.Cabecalho.iniciar === 'function'
        ) {

            await window.Cabecalho.iniciar();

        }


        /*
        -------------------------------------------------
        MODAL ANUNCIAR
        -------------------------------------------------

        O componente é carregado diretamente pelo
        index.html, pois o botão Anunciar está no
        cabeçalho.

        -------------------------------------------------
        */

        if (
            window.ModalAnunciar &&
            typeof window.ModalAnunciar.iniciar === 'function'
        ) {

            await window.ModalAnunciar.iniciar();


            console.log(
                'Modal Anunciar inicializado pelo cabeçalho.'
            );

        } else {

            console.warn(
                'Modal Anunciar ainda não está disponível.'
            );

        }


        /*
        -------------------------------------------------
        INTERAÇÕES DE PERFIL
        -------------------------------------------------

        O componente é universal e será utilizado pelos
        perfis exibidos no Index.

        A página de apresentação do perfil também utiliza
        exatamente o mesmo componente.

        -------------------------------------------------
        */

        if (
            window.InteracoesPerfil &&
            typeof window.InteracoesPerfil.inicializar === 'function'
        ) {

            await window.InteracoesPerfil.inicializar();


            console.log(
                'Interações de perfil inicializadas.'
            );

        } else {

            console.warn(
                'Componente de interações de perfil ainda não está disponível.'
            );

        }


        /*
        -------------------------------------------------
        AVISO DO FEED
        -------------------------------------------------

        Inicializa o componente responsável por:

        - fechar o aviso;
        - salvar o fechamento no localStorage;
        - remover o aviso ao recarregar a página.

        -------------------------------------------------
        */

        if (
            window.MusicalWorldAviso &&
            typeof window.MusicalWorldAviso.inicializar === 'function'
        ) {

            window.MusicalWorldAviso.inicializar();


            console.log(
                'Aviso do feed inicializado.'
            );

        } else {

            console.warn(
                'Componente de aviso do feed ainda não está disponível.'
            );

        }


        /*
        -------------------------------------------------
        ONBOARDING
        -------------------------------------------------

        O menu inferior é criado dinamicamente pelo
        menu-inferior.js.

        O onboarding aguarda o botão Perfil existir
        antes de criar a primeira orientação.

        -------------------------------------------------
        */

        if (
            window.MusicalWorldOnboarding &&
            typeof window.MusicalWorldOnboarding.iniciar === 'function'
        ) {

            await window.MusicalWorldOnboarding.iniciar();


            console.log(
                'Onboarding inicializado pelo Index.'
            );

        }


        /*
        -------------------------------------------------
        MODAL DE AVALIAÇÃO
        -------------------------------------------------

        O componente verifica se o usuário atualmente
        autenticado possui alguma contratação concluída
        em que ele foi o contratante e que ainda não
        possui uma avaliação vinculada.

        A verificação utiliza o banco como fonte de
        verdade.

        Portanto:

        contratação concluída
                 +
        nenhuma avaliação para a contratação
                 =
        modal disponível para avaliação.

        Depois que a avaliação é inserida em
        avaliacoes_musicos, a mesma contratação deixa
        automaticamente de aparecer como pendente.

        O componente é universal para todos os tipos de
        artistas e não depende de uma categoria específica.

        -------------------------------------------------
        */

        if (
            window.MusicalWorldModalAvaliacao &&
            typeof window.MusicalWorldModalAvaliacao.iniciar === 'function'
        ) {

            await window.MusicalWorldModalAvaliacao.iniciar();


            console.log(
                'Modal de avaliação inicializado pelo Index.'
            );

        } else {

            console.warn(
                'Modal de avaliação ainda não está disponível.'
            );

        }

    }
);

</script>


</body>

</html>
