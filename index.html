<!DOCTYPE html>

<head>

<meta

<!-- =====================================================
     CSS PRINCIPAL
     ===================================================== -->

<link

<!-- =====================================================
     CSS DO MENU INFERIOR
     ===================================================== -->

<link
    rel="stylesheet"

>

<!-- =====================================================
     CSS DO MODAL DE FILTROS
     ===================================================== -->

<link

    href="css/modal-filtro.css"

<!-- =====================================================

<!-- =====================================================

<!-- =====================================================

     =====================================================

     - Estilizar os balões de orientação.
     - Destacar o elemento indicado.

     ===================================================== -->

    href="css/components/onboarding.css"

<!-- =====================================================
     CSS DAS INTERAÇÕES DE PERFIL
     =====================================================

     Responsabilidade:

     - Curtir perfil.
     - Comentar perfil.
     - Favoritar perfil.
     - Exibir estados ativos.
     - Exibir contadores.

     Este componente é universal e poderá ser utilizado
     tanto no Index quanto na página de apresentação
     do perfil.

     ===================================================== -->

    rel="stylesheet"
    href="css/components/interacoes-perfil.css"
>

<!-- =====================================================
     FONTES
     ===================================================== -->

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

</head>

<body>

<!-- =====================================================
     CONTAINER PRINCIPAL DO APLICATIVO
     ===================================================== -->

<div class="app-container">

<!-- =====================================================
     CABEÇALHO PRINCIPAL
     =====================================================

     Responsabilidade:

     - Exibir a identidade visual do MusicalWorld.
     - Abrir o menu da conta através da seta ao lado
       da logo.
     - Abrir o fluxo de criação de anúncio.
     - Exibir notificações.
     - Exibir mensagens.

     O acesso ao perfil do usuário não fica mais
     representado por avatar no topo.

     O menu da conta fica vinculado à identidade
     visual da marca.

     ===================================================== -->

<header class="navbar">

<!-- =================================================
     ÁREA DA MARCA
     ================================================= -->

<div class="navbar-brand-area">

<!-- =============================================
     CONTAINER DA CONTA
     =============================================

     A logo e a seta formam o controle responsável
     por abrir o menu da conta.

     ============================================= -->

<div class="cabecalho-conta">

    <!-- =========================================
         LOGO + SETA
         ========================================= -->

    <button
        type="button"
        id="cabecalho-conta-toggle"
        class="cabecalho-conta-toggle"
        aria-label="Abrir opções da conta"
        aria-haspopup="true"
        aria-expanded="false"
        title="Opções da conta"
        onclick="window.Cabecalho && typeof window.Cabecalho.alternarMenuConta === 'function' && window.Cabecalho.alternarMenuConta()"
    >

        <!-- =====================================
             LOGO MUSICALWORLD
             ===================================== -->

        <span
            id="cabecalho-logo"
            class="logo"
        >
            Musical<span>World</span>
        </span>

        <!-- =====================================
             SETA DO MENU DA CONTA
             ===================================== -->

        <svg
            class="cabecalho-conta-seta"
            id="cabecalho-conta-seta"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
        >

            <path
                d="M7 9.5L12 14.5L17 9.5"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
            />

        </svg>

    </button>

    <!-- =============================================
         MENU DA CONTA
         ============================================= -->

    <div
        id="cabecalho-menu-conta"
        class="cabecalho-menu-conta"
        role="menu"
        aria-hidden="true"
    >

        <!-- =========================================
             TROCAR DE USUÁRIO
             ========================================= -->

        <button
            type="button"
            class="cabecalho-menu-conta-item"
            role="menuitem"
            onclick="window.Cabecalho && typeof window.Cabecalho.trocarConta === 'function' && window.Cabecalho.trocarConta()"
        >

            <!-- =====================================
                 ÍCONE TROCAR USUÁRIO
                 ===================================== -->

            <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
            >

                <path
                    d="M16 20V18.5C16 16.57 14.43 15 12.5 15H7.5C5.57 15 4 16.57 4 18.5V20"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                />

                <circle
                    cx="10"
                    cy="8"
                    r="3"
                    stroke="currentColor"
                    stroke-width="1.8"
                />

                <path
                    d="M17 8H21"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                />

                <path
                    d="M19 6L21 8L19 10"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

            </svg>

            <span>
                Trocar de usuário
            </span>

        </button>

        <!-- =========================================
             DIVISOR
             ========================================= -->

        <div
            class="cabecalho-menu-conta-divisor"
            aria-hidden="true"
        ></div>

        <!-- =========================================
             SAIR
             ========================================= -->

        <button
            type="button"
            class="cabecalho-menu-conta-item cabecalho-menu-conta-sair"
            role="menuitem"
            onclick="window.Cabecalho && typeof window.Cabecalho.sair === 'function' && window.Cabecalho.sair()"
        >

            <!-- =====================================
                 ÍCONE SAIR
                 ===================================== -->

            <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
            >

                <path
                    d="M10 5H6.5C5.67 5 5 5.67 5 6.5V17.5C5 18.33 5.67 19 6.5 19H10"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                />

                <path
                    d="M13 8L17 12L13 16"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

                <path
                    d="M17 12H9"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                />

            </svg>

            <span>
                Sair
            </span>

        </button>

    </div>

</div>

</div>

<!-- =================================================
     ÁREA DE AÇÕES DO CABEÇALHO
     ================================================= -->

<div class="navbar-actions">

<!-- =============================================
     ANUNCIAR
     =============================================

     O botão Anunciar foi retirado do menu inferior
     e passa a ocupar o cabeçalho.

     Ele abre o mesmo ModalAnunciar utilizado
     anteriormente pelo menu inferior.

     ============================================= -->

<button
    type="button"
    class="cabecalho-btn-anunciar"
    onclick="window.ModalAnunciar && window.ModalAnunciar.abrir()"
    title="Criar anúncio"
    aria-label="Criar anúncio"
>

    <svg
        class="cabecalho-anunciar-icon"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
    >

        <path
            d="M12 5V19"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
        />

        <path
            d="M5 12H19"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
        />

    </svg>

    <span>
        Anunciar
    </span>

</button>

<!-- =============================================
     NOTIFICAÇÕES
     ============================================= -->

<button
    type="button"
    class="nav-icon-btn"
    onclick="window.location.href='notificacoes.html'"
    title="Notificações"
    aria-label="Notificações"
>

    <svg
        class="top-icon-svg"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
    >

        <path
            d="M18 9.5C18 6.46 15.76 4 12 4C8.24 4 6 6.46 6 9.5V13.2C6 14.1 5.7 14.97 5.15 15.68L4.5 16.5H19.5L18.85 15.68C18.3 14.97 18 14.1 18 13.2V9.5Z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        />

        <path
            d="M9.5 19C10.05 19.63 10.92 20 12 20C13.08 20 13.95 19.63 14.5 19"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
        />

    </svg>

    <span
        id="badge-notificacoes"
        class="notification-badge"
        aria-label="Novas notificações"
        style="display: none;"
    >
        0
    </span>

</button>

<!-- =============================================
     MENSAGENS
     ============================================= -->

<button
    type="button"
    class="nav-icon-btn"
    onclick="window.location.href='mensagens.html'"
    title="Mensagens"
    aria-label="Mensagens"
>

    <svg
        class="top-icon-svg"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
    >

        <path
            d="M12 4.5C7.86 4.5 4.5 7.63 4.5 11.5C4.5 13.35 5.3 15.03 6.63 16.25L6 19.5L9.2 17.85C10.08 18.12 11.02 18.25 12 18.25C16.14 18.25 19.5 15.12 19.5 11.5C19.5 7.63 16.14 4.5 12 4.5Z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        />

    </svg>

    <span
        id="badge-mensagens"
        class="notification-badge"
        aria-label="Novas mensagens"
        style="display: none;"
    >
        0
    </span>

</button>

<!-- =============================================
     CARREGAMENTO DO CABEÇALHO
     ============================================= -->

<div
    id="cabecalho-carregando"
    class="cabecalho-usuario-loading"
    style="display: none;"
    aria-hidden="true"
>

    <span></span>

</div>

<!-- =============================================
     ESTADO DESLOGADO
     ============================================= -->

<div
    id="cabecalho-deslogado"
    class="cabecalho-usuario-estado"
    style="display: none;"
    aria-hidden="true"
></div>

<!-- =============================================
     ESTADO LOGADO
     ============================================= -->

<div
    id="cabecalho-logado"
    class="cabecalho-logado"
    style="display: none;"
    aria-hidden="true"
></div>

</div>

</header>

<!-- =================================================
     MODAL DE PRÉ-VISUALIZAÇÃO DE NOTIFICAÇÃO
     ================================================= -->

<div
    id="modal-notificacao-container"
></div>

<!-- =================================================
     CONTEÚDO PRINCIPAL
     ================================================= -->

<main class="main-content">

<!-- =================================================
     AVISO DO FEED

<section

>

<div class="feed-aviso-icone">

    <svg

    >

            d="M12 3L21 8V16L12 21L3 16V8L12 3Z"

        <path

        />

        <circle

</div>

<button

        />

        <path
            d="M18 6L6 18"

    </svg>

</button>

<!-- =================================================
     SEÇÃO DE PROFISSIONAIS

<section class="profissionais-section">

<!-- =============================================
     CONTADOR DE PROFISSIONAIS

<div

<!-- =============================================

</div>

>

    <span>
        Tente alterar os filtros para encontrar novos talentos.
    </span>

</div>

<!-- =============================================
     SENTINELA DO SCROLL INFINITO
     ============================================= -->

<div
    id="feed-sentinela"
    aria-hidden="true"

</section>

</main>

<!-- =================================================
     MODAL DE FILTROS
     ================================================= -->

<div
    id="modal-filtro-container"
></div>

<!-- =================================================

     O menu é criado dinamicamente pelo

     Pesquisa

<div
    id="menu-inferior-container"
></div>

</div>

     SUPABASE

<script

></script>

<!-- =====================================================
     CORE
     ===================================================== -->

<script src="js/core/SupabaseClient.js"></script>

<script src="js/core/Sessao.js"></script>

<script src="js/core/UsuarioAtual.js"></script>

<script src="js/core/ControleSessao.js"></script>

<script src="js/core/RoteamentoPerfil.js"></script>

     ===================================================== -->

<script src="js/components/Cabecalho.js"></script>

<script src="js/components/modal-notificacao.js"></script>

<script src="js/components/modal-anunciar.js"></script>

<script src="js/dados/municipios-brasil.js"></script>

<script src="js/components/modal-filtro.js"></script>

<!-- =====================================================
     COMPONENTE UNIVERSAL DE INTERAÇÕES DE PERFIL
     =====================================================

     Responsabilidade:

     - Curtidas.
     - Comentários.
     - Favoritos.
     - Contadores.
     - Estado das ações do usuário.

     O componente é compartilhado entre o Index
     e a página de apresentação do perfil.

     ===================================================== -->

<script src="js/components/interacoes-perfil.js"></script>

<!-- =====================================================
     LÓGICA PRINCIPAL DO INDEX
     ===================================================== -->

<script src="js/main.js"></script>

<script src="js/index/anuncio.js"></script>

<script src="js/index/paginacao.js"></script>

<script src="js/index/aviso-feed.js"></script>

<!-- =====================================================
     MENU INFERIOR
     ===================================================== -->

<script src="js/components/menu-inferior.js"></script>

<!-- =====================================================
     ONBOARDING
     ===================================================== -->

<script src="js/components/onboarding.js"></script>

<!-- =====================================================
     INICIALIZAÇÃO DOS COMPONENTES
     ===================================================== -->

<script>

document.addEventListener(
    'DOMContentLoaded',
    async function () {

        console.log(
            'Inicializando componentes principais do MusicalWorld...'
        );


        /*
        -------------------------------------------------
        CABEÇALHO
        -------------------------------------------------

        O Cabecalho continua responsável pela sessão,
        mensagens não lidas, Realtime e prévias de novas
        mensagens.

        Também passa a controlar o menu da conta aberto
        através da seta ao lado da logo.

        -------------------------------------------------
        */

        if (
            window.Cabecalho &&
            typeof window.Cabecalho.iniciar ===
            'function'
        ) {

            await window.Cabecalho.iniciar();

        }


        /*
        -------------------------------------------------
        MODAL ANUNCIAR
        -------------------------------------------------

        O componente agora é carregado diretamente pelo
        index.html, pois o botão Anunciar foi transferido
        para o cabeçalho.

        -------------------------------------------------
        */

        if (
            window.ModalAnunciar &&
            typeof window.ModalAnunciar.iniciar ===
            'function'
        ) {

            await window.ModalAnunciar.iniciar();


            console.log(
                'Modal Anunciar inicializado pelo cabeçalho.'
            );

        } else {

            console.warn(
                'Modal Anunciar ainda não está disponível.'
            );

        }


        /*
        -------------------------------------------------
        INTERAÇÕES DE PERFIL
        -------------------------------------------------

        O componente é universal e será utilizado pelos
        perfis exibidos no Index.

        A página de apresentação do perfil também utilizará
        exatamente o mesmo componente.

        O componente deverá localizar os elementos que
        possuem data-perfil-id e inicializar as ações:

        - Curtir.
        - Comentar.
        - Favoritar.

        -------------------------------------------------
        */

        if (
            window.InteracoesPerfil &&
            typeof window.InteracoesPerfil.inicializar ===
            'function'
        ) {

            await window.InteracoesPerfil.inicializar();


            console.log(
                'Interações de perfil inicializadas.'
            );

        } else {

            console.warn(
                'Componente de interações de perfil ainda não está disponível.'
            );

        }


        /*
        -------------------------------------------------
        ONBOARDING
        -------------------------------------------------

        O menu inferior é criado dinamicamente pelo
        menu-inferior.js.

        O onboarding aguarda o botão Perfil existir
        antes de criar a primeira orientação.

        -------------------------------------------------
        */

        if (
            window.MusicalWorldOnboarding &&
            typeof window.MusicalWorldOnboarding.iniciar ===
            'function'
        ) {

            await window.MusicalWorldOnboarding.iniciar();


            console.log(
                'Onboarding inicializado pelo Index.'
            );

        }

    }
);

</script>

</body>
