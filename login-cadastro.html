<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ArtistaShow - Acesso</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/login-cadastro.css">
</head>
<body>

    <div class="mobile-container login-container" style="justify-content: flex-start; padding-top: 32px;">
        
        <!-- Abas Entrar / Cadastrar -->
        <div class="auth-tabs duas-opcoes" id="authTabs" style="margin: 0 0 24px 0;">
            <div class="slider-bg-duas"></div>
            <button class="tab-btn ativo" onclick="mudarAbaLogin('entrar', 0)">Entrar</button>
            <button class="tab-btn" onclick="mudarAbaLogin('cadastrar', 1)">Cadastrar</button>
        </div>

        <div class="login-header" style="text-align: left; margin-top: 0; margin-bottom: 20px;">
            <h1 id="loginTitle" style="font-size: 20px; font-weight: 700; color: #111; margin-bottom: 4px;">Bem-vindo de volta!</h1>
            <p id="loginSubtitle" style="font-size: 12px; color: #666;">Acesse sua conta para gerenciar seus agendamentos.</p>
        </div>

        <!-- Botões de Login Social (Google e Apple) -->
        <div style="width: 100%; margin-bottom: 16px;">
            <button class="social-login-btn google-btn" onclick="fazerLoginSocial('Google')" style="margin-bottom: 10px;">
                <i class="fa-brands fa-google"></i>
                <span id="googleBtnText">Continuar com o Google</span>
            </button>
            <button class="social-login-btn apple-btn" onclick="fazerLoginSocial('Apple')">
                <i class="fa-brands fa-apple"></i>
                <span id="appleBtnText">Continuar com a Apple</span>
            </button>
        </div>

        <div class="login-divider" style="margin: 10px 0 16px 0;">
            <span id="dividerText">ou</span>
        </div>

        <!-- Campos de E-mail e Senha (Mantendo exatamente o layout da imagem) -->
        <div style="width: 100%;">
            <div class="filter-select-wrapper full-width" id="nomeFieldWrapper" style="display: none;">
                <span style="font-size: 11px; color: #666; display: block; margin-bottom: 4px; font-weight: 500;">Nome</span>
                <input type="text" class="filter-select login-input" placeholder="Seu nome completo">
            </div>

            <div class="filter-select-wrapper full-width">
                <span style="font-size: 11px; color: #666; display: block; margin-bottom: 4px; font-weight: 500;">E-mail</span>
                <input type="email" class="filter-select login-input" placeholder="rafaelmelo116@gmail.com" value="rafaelmelo116@gmail.com">
            </div>

            <div class="filter-select-wrapper full-width">
                <span style="font-size: 11px; color: #666; display: block; margin-bottom: 4px; font-weight: 500;">Senha</span>
                <input type="password" class="filter-select login-input" placeholder="••••••••••••" value="12345678">
            </div>

            <button class="modal-btn-next" id="submitBtn" onclick="window.location.href='index.html'" style="margin-top: 8px;">Entrar</button>
        </div>

    </div>
    <script src="js/login-cadastro.js"></script>
</body>
</html>
