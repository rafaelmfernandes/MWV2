<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <!-- ==================================================
         CONFIGURAÇÕES BÁSICAS
    =================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MusicalWorld - Acesso</title>


    <!-- ==================================================
         CSS PRINCIPAL DA PÁGINA
    =================================================== -->

    <link
        rel="stylesheet"
        href="css/login.css"
    >


    <!-- ==================================================
         CSS — MODAL DE RECUPERAÇÃO DE SENHA

         Responsabilidade:
         - Modal para solicitar recuperação.
         - Campo de e-mail.
         - Estados de erro e sucesso.
         - Responsividade.
    =================================================== -->

    <link
        rel="stylesheet"
        href="css/components/modal-recuperar-senha.css"
    >


    <!-- ==================================================
         CSS — MODAL DE REDEFINIÇÃO DE SENHA

         Responsabilidade:
         - Tela exibida depois que o usuário
           clica no link recebido por e-mail.
         - Campos para nova senha e confirmação.
    =================================================== -->

   <link
    rel="stylesheet"
    href="css/components/modal-nova-senha.css"
>


    <!-- ==================================================
         CSS — CONTROLE DE VISIBILIDADE DA SENHA

         Responsabilidade:
         - Ícone de olho.
         - Mostrar senha.
         - Ocultar senha.
         - Funciona também em campos
           criados dinamicamente.
    =================================================== -->

    <link
        rel="stylesheet"
        href="css/components/password-toggle.css"
    >

</head>


<body>


<!-- ======================================================
     CONTAINER PRINCIPAL DA PÁGINA
======================================================= -->

<div class="app-container">


    <!-- ==================================================
         CARD PRINCIPAL DE AUTENTICAÇÃO
    =================================================== -->

    <div class="checkout-card">


        <!-- ==================================================
             CABEÇALHO
        =================================================== -->

        <div class="auth-header">

            <h1 class="auth-title">
                Musical<span>World</span>
            </h1>

            <p class="auth-subtitle">
                Entre ou cadastre-se para continuar
            </p>

        </div>


        <!-- ==================================================
             TOGGLE ENTRAR / CADASTRAR
        =================================================== -->

        <div class="auth-toggle-container">

            <div
                id="auth-toggle-slider"
                class="auth-toggle-slider">
            </div>


            <!-- ==================================================
                 ABA — ENTRAR
            =================================================== -->

            <button
                type="button"
                class="auth-tab-btn active"
                id="tab-login"
                onclick="alternarAba('login')"
            >
                Entrar
            </button>


            <!-- ==================================================
                 ABA — CADASTRAR
            =================================================== -->

            <button
                type="button"
                class="auth-tab-btn"
                id="tab-cadastro"
                onclick="alternarAba('cadastro')"
            >
                Cadastrar
            </button>

        </div>


        <!-- ==================================================
             CONTEÚDO DINÂMICO

             Login.js e Cadastro.js inserem aqui
             os respectivos formulários.
        =================================================== -->

        <div
            id="auth-content-container"
            style="width: 100%;"
        >

            <!--
                O formulário será criado
                dinamicamente pelo JavaScript.
            -->

        </div>

    </div>

</div>



<!-- ======================================================
     MODAL — RECUPERAÇÃO DE SENHA

     Este container é utilizado pelo:

     js/components/modal-recuperar-senha.js

     O conteúdo é criado dinamicamente.
======================================================= -->

<div
    id="modal-recuperar-senha-container"
    class="mw-recuperacao-modal-container"
    aria-hidden="true"
>
</div>



<!-- ======================================================
     MODAL — REDEFINIÇÃO DE SENHA

     Este container é utilizado pelo:

     js/components/modal-redefinir-senha.js

     Ele será exibido quando o usuário clicar no
     link recebido por e-mail.

     Exemplo do fluxo:

     Login
        ↓
     Esqueci minha senha
        ↓
     Digita e-mail
        ↓
     Supabase envia e-mail
        ↓
     Usuário clica no link
        ↓
     Supabase retorna para esta página
        ↓
     Modal de redefinição aparece
        ↓
     Nova senha
        ↓
     Confirmar nova senha
        ↓
     Supabase atualiza a senha
        ↓
     Usuário pode entrar novamente
======================================================= -->

<div
    id="modal-redefinir-senha-container"
    class="mw-redefinir-senha-modal-container"
    aria-hidden="true"
>
</div>



<!-- ======================================================
     SUPABASE
======================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>



<!-- ======================================================
     CLIENTE SUPABASE
======================================================= -->

<script
    src="js/core/SupabaseClient.js"
></script>



<!-- ======================================================
     CONTROLE DE SESSÃO
======================================================= -->

<script
    src="js/core/Sessao.js"
></script>



<!-- ======================================================
     PERFIL DO USUÁRIO
======================================================= -->

<script
    src="js/auth/Perfil.js"
></script>



<!-- ======================================================
     AUTENTICAÇÃO — LOGIN
======================================================= -->

<script
    src="js/auth/Login.js"
></script>



<!-- ======================================================
     AUTENTICAÇÃO — CADASTRO
======================================================= -->

<script
    src="js/auth/Cadastro.js"
></script>



<!-- ======================================================
     CONTROLE PRINCIPAL DA PÁGINA

     Responsabilidade:

     - Alternar Entrar/Cadastrar.
     - Criar os formulários.
     - Processar login.
     - Processar cadastro.
     - Abrir recuperação de senha.
     - Processar sessão inicial.
======================================================= -->

<script
    src="js/login.js"
></script>



<!-- ======================================================
     CONTROLE DE VISIBILIDADE DA SENHA

     Observa os campos de senha criados dinamicamente
     e adiciona os respectivos botões de mostrar/ocultar.
======================================================= -->

<script
    src="js/auth/MostrarSenha.js"
></script>



<!-- ======================================================
     MODAL — RECUPERAÇÃO DE SENHA

     Responsabilidade:

     - Abrir modal.
     - Receber e-mail.
     - Validar e-mail.
     - Solicitar link ao Supabase.
     - Mostrar sucesso/erro.
     - Não utiliza prompt().
     - Não utiliza alert().
======================================================= -->

<script
    src="js/components/modal-recuperar-senha.js"
></script>



<!-- ======================================================
     MODAL — REDEFINIÇÃO DE SENHA

     Responsabilidade:

     - Detectar quando o Supabase retornou
       através de um link de recuperação.
     - Exibir o formulário de nova senha.
     - Confirmar a nova senha.
     - Atualizar a senha no Supabase.
     - Encerrar o fluxo de recuperação.
======================================================= -->

<script
    src="js/components/modal-nova-senha.js"
></script>



<!-- ======================================================
     INICIALIZAÇÃO DO FLUXO DE REDEFINIÇÃO

     Este bloco garante que, caso o usuário tenha
     acabado de voltar do link enviado pelo Supabase,
     o módulo de redefinição seja inicializado.
======================================================= -->

<script>

    document.addEventListener(
        'DOMContentLoaded',
        async () => {

            try {

                if (
                    window.MusicalWorldModalRedefinirSenha &&
                    typeof
                    window.MusicalWorldModalRedefinirSenha.iniciar
                    === 'function'
                ) {

                    await
                    window.MusicalWorldModalRedefinirSenha.iniciar();

                }

            } catch (erro) {

                console.error(
                    'Erro ao inicializar redefinição de senha:',
                    erro
                );

            }

        }
    );

</script>



<!-- ======================================================
     OBSERVADOR DA SESSÃO
======================================================= -->

<script>

    if (
        window.Sessao &&
        typeof window.Sessao.observar === 'function'
    ) {

        Sessao.observar(
            (evento, sessao) => {

                console.log(
                    'Sessão:',
                    evento,
                    sessao
                );

            }
        );

    }

</script>


</body>

</html>
