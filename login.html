<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtistaShow - Acesso</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="app-container" style="justify-content: center; padding: 24px;">
    
    <div class="checkout-card" style="width: 100%; max-width: 380px; align-items: center; padding: 24px 20px; gap: 20px; margin: auto;">
      
      <!-- Logo / Título -->
      <div style="text-align: center;">
        <h1 style="font-size: 20px; color: #fff; margin-bottom: 4px;">ArtistaShow</h1>
        <p style="font-size: 12px; color: #a1a1aa;">Entre ou cadastre-se para continuar</p>
      </div>

      <!-- Toggle Slider (Alternador) -->
      <div class="auth-toggle-container">
        <div id="auth-toggle-slider" class="auth-toggle-slider"></div>
        <button type="button" class="auth-tab-btn active" id="tab-login" onclick="alternarAba('login')">Entrar</button>
        <button type="button" class="auth-tab-btn" id="tab-cadastro" onclick="alternarAba('cadastro')">Cadastrar</button>
      </div>

      <!-- Conteúdo Dinâmico (Carregado abaixo via JS) -->
      <div id="auth-content-container" style="width: 100%;">
        <!-- O formulário correspondente será injetado aqui -->
      </div>

    </div>

  </div>

  <script src="js/login.js"></script>
</body>
</html>
